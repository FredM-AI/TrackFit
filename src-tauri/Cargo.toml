[package]
name = "graphite"
version.workspace = true
description = "Graphite - tracker de poker MTT pour Winamax (100% local)"
authors = ["Frederic"]
license.workspace = true
repository = "https://github.com/FredM-AI/TrackFit"
edition.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "graphite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
gr-analytics = { path = "../crates/gr-analytics" }
gr-core = { path = "../crates/gr-core" }
gr-ingest = { path = "../crates/gr-ingest" }
gr-parser-api = { path = "../crates/gr-parser-api" }
gr-store = { path = "../crates/gr-store" }
rusqlite = { version = "0.31", features = ["bundled"] }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.6", features = ["tray-icon"] }
tauri-plugin-log = "2"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = "0.3"
ts-rs = "9"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"
