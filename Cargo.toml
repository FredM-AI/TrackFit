[workspace]
resolver = "2"
members = [
  "crates/gr-core",
  "crates/gr-parser-api",
  "crates/gr-parser-winamax",
  "crates/gr-equity",
  "crates/gr-stats",
  "crates/gr-store",
  "crates/gr-analytics",
  "crates/gr-ingest",
  "crates/gr-synth",
  "crates/gr-winmon",
  "src-tauri",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "UNLICENSED"

# ADR-004: dependencies compile at opt-level 1 in dev to keep the Celeron build fast.
[profile.dev.package."*"]
opt-level = 1
